name: Fix train page station icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: replace broken station image with lucide icon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch train page
        env:
          FILE: app/trains/[slug]/page.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/trains/[slug]/page.tsx')
          s = p.read_text(encoding='utf-8')

          # Remove the fragile data-URI image constant.
          s, n1 = re.subn(r'^const STATION_ICON = "data:image/png;base64,[^\n]+";\n\n', '', s, count=1, flags=re.M)

          # Render the already-imported Lucide TrainFront directly instead of a broken data image.
          pattern = r'<div aria-hidden="true" className="station-icon-wrap" style=\{\{[^}]+\}\}><img src=\{STATION_ICON\} alt="" style=\{\{[^}]+\}\}/></div>'
          replacement = '<div aria-hidden="true" className="station-icon-wrap" style={{width:64,height:56,display:"flex",alignItems:"center",justifyContent:"center",overflow:"visible",flexShrink:0}}><TrainFront size={54} strokeWidth={2.8} color="#334155" /></div>'
          s, n2 = re.subn(pattern, replacement, s, count=1)

          # Keep the section heading inside the viewport on narrow screens.
          old = 'style={{margin:"4px 2px 0",fontSize:18,lineHeight:1.3,fontWeight:800,color:"#1e293b"}}'
          new = 'style={{margin:"4px 2px 0",fontSize:18,lineHeight:1.3,fontWeight:800,color:"#1e293b",maxWidth:"100%",whiteSpace:"normal",overflowWrap:"anywhere"}}'
          s, n3 = s.replace(old, new, 1), s.count(new)

          if n1 != 1 or n2 != 1 or n3 != 1:
              raise SystemExit(f'Patch did not match exactly: constant={n1}, icon={n2}, heading={n3}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/trains/[slug]/page.tsx'
          git commit -m 'fix: replace broken station image with lucide icon'
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-train-page-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'chore: remove temporary train page fix workflow'
          git push
